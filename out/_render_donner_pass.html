const TAG = U.tags;
const CHUNKS = [];

  l.words.forEach((w, i) => {
    cur.push(w); const len = cur.map(x => x.w).join(' ').length, punct = /[.,:!?]$/.test(toks[i] || '');

  if (sc.id === 'end') return;
